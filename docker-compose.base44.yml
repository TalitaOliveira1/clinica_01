name: clinica01

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica_dev
      POSTGRES_DB: clinica
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure
    labels:
      base44.project: Banco de dados
      base44.kind: infra

  # Aplica as migrações e popula os dados iniciais (executa uma vez e encerra)
  migrate:
    image: node:22-alpine
    working_dir: /app/backend
    volumes:
      - .:/app
      - backend_node_modules:/app/backend/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://clinica:clinica_dev@db:5432/clinica
    env_file:
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && npm run db:migrate && npm run db:seed
    depends_on:
      db:
        condition: service_healthy

  api:
    image: node:22-alpine
    working_dir: /app/backend
    volumes:
      - .:/app
      - backend_node_modules:/app/backend/node_modules
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgres://clinica:clinica_dev@db:5432/clinica
    env_file:
      - /run/base44/app.env
    ports:
      - "4000:4000"
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure
    labels:
      base44.project: Clínica API
      base44.kind: api
      base44.port: "4000"

  web:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - API_PROXY_TARGET=http://api:4000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
    ports:
      - "3000:5173"
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure
    labels:
      base44.project: Clínica Painel
      base44.kind: web
      base44.port: "3000"

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
